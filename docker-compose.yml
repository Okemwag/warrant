services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: warrant
      POSTGRES_PASSWORD: warrant
      POSTGRES_DB: warrant
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warrant"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://warrant:warrant@postgres:5432/warrant?sslmode=disable
      WARRANT_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

volumes:
  pgdata:
